<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>یاری ڕیڤێرس | Karosh Studio</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="یاری ڕیڤێرس">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{
  --bg: radial-gradient(circle at 50% 0%, #1e1933 0%, #0d0c14 100%);
  --card: rgba(28, 25, 41, 0.85);
  --tx: #f8f7fa;
  --mu: #9e9bb0;
  --ac: #7952fc;
  --ac-glow: rgba(121, 82, 252, 0.4);
  --ok: #10b981;
  --bd: rgba(255, 255, 255, 0.1);
  --gold: #f59e0b;
  --gold-glow: rgba(245, 158, 11, 0.35);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  min-height:100vh;
  background: var(--bg);
  background-attachment: fixed;
  color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;
  line-height:1.5;
}
main{max-width:440px;margin:0 auto;padding:16px 18px 40px}

.brand-header{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 0 6px;text-align:center}
.brand-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(245,158,11,0.12);border:1px solid var(--gold);box-shadow:0 0 16px var(--gold-glow);padding:6px 18px;border-radius:30px;margin-bottom:8px}
.brand-badge .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.brand-badge span{font-size:13px;letter-spacing:0.18em;font-weight:800;color:#fff;direction:ltr}
.brand-badge span b{color:var(--gold)}

.hero-title{font-size:25px;font-weight:900;margin:6px 0 2px;background:linear-gradient(135deg,#fff,#c3b4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center}
.hero-sub{color:var(--mu);font-size:14px;text-align:center;margin:0 0 16px}

.card{
  background:var(--card);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--bd);
  border-radius:20px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

button,select,input{font:inherit;color:inherit}
button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid var(--bd);
  background:rgba(255,255,255,0.06);
  font-weight:700;
  cursor:pointer;
  transition:all .18s ease;
  margin:8px 0;
}
button:active{transform:scale(0.98)}
button.p{background:linear-gradient(135deg,#7952fc,#5e32ea);color:#fff;border:0;box-shadow:0 6px 18px var(--ac-glow)}
button.g{background:linear-gradient(135deg,#10b981,#059669);color:#fff;border:0;box-shadow:0 6px 18px rgba(16,185,129,0.3)}
button.red{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;border:0;box-shadow:0 6px 18px rgba(239,68,68,0.4)}
button.on{border-color:var(--ok);background:rgba(16,185,129,0.2);color:#34d399}
button:disabled{opacity:.45;cursor:not-allowed}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--bd);
  background:rgba(0,0,0,0.3);
  margin:8px 0;
  color:#fff;
  outline:none;
}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1}.row .s{flex:0 0 95px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{background:rgba(255,255,255,0.08);border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:14px}
.chip a{color:#ef4444;margin-right:6px;cursor:pointer}

.big-box{
  background:rgba(0,0,0,0.35);
  border:2px dashed rgba(255,255,255,0.18);
  border-radius:16px;
  padding:20px;
  text-align:center;
  margin:12px 0;
}
.big{font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 14px var(--gold-glow)}
.sc{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.pulse{animation:pl 1s infinite}@keyframes pl{50%{opacity:.3}}
.foot{display:block;text-align:center;color:var(--mu);font-size:13px;margin:28px 0 10px;text-decoration:none}
.foot b{color:var(--gold)}
</style>
</head>
<body>
<main id="app"></main>

<script>
const KU=["سڵاو","ماڵ","ئاو","نان","دار","شار","دڵ","ئاسمان","کتێب","خۆر","مانگ","کچ","کوڕ","دەست","چاو","باخ","گوڵ","پیاو","ژن","شەو","ڕۆژ","بەفر","باران","کوردستان","قاوە","چا","مۆبایل","فرۆکە","کامێرا"];
let S={screen:"setup",players:[],turn:0,scores:{},mode:null,word:null,fwd:null,rev:null,revealed:false,checked:{},busy:"",msg:"",recObj:null,showWord:true,peek:false,tryRev:null};
const $=id=>document.getElementById(id);
const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let audioCtx=null;
function getCtx(){
  if(!audioCtx){
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    audioCtx=new AudioCtx();
  }
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}

let activeSource=null;
function playBuffer(buf){
  if(!buf)return;
  const c=getCtx();
  try{if(activeSource)activeSource.stop()}catch(_){}
  activeSource=c.createBufferSource();
  activeSource.buffer=buf;
  activeSource.connect(c.destination);
  activeSource.start(0);
}

// سیستەمی بێ کێشەی تۆمارکردن تایبەت بە Safari و مۆبایل
let micStream=null;
async function startRecorder(){
  const c=getCtx();
  if(!micStream||!micStream.getTracks().some(t=>t.readyState==="live")){
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }
  
  const chunks=[];
  let mediaRec;
  try{
    mediaRec=new MediaRecorder(micStream);
  }catch(err){
    mediaRec=new MediaRecorder(micStream,{mimeType:'audio/mp4'});
  }
  
  mediaRec.ondataavailable=e=>{
    if(e.data&&e.data.size>0)chunks.push(e.data);
  };
  
  mediaRec.start();
  
  return{
    stop:()=>{
      return new Promise((resolve,reject)=>{
        mediaRec.onstop=async()=>{
          try{
            const blob=new Blob(chunks,{type:chunks[0]?.type||'audio/wav'});
            const arrayBuf=await blob.arrayBuffer();
            const decoded=await c.decodeAudioData(arrayBuf);
            resolve(decoded);
          }catch(e){
            reject(e);
          }
        };
        mediaRec.stop();
      });
    }
  };
}

// پرۆسێسکردنی خاوێن بەبێ دەستکاریکردنی فریکوێنسی و خشەخش
function processAudio(buf){
  const c=getCtx();
  const d=buf.getChannelData(0);
  const sr=buf.sampleRate;
  
  const f=c.createBuffer(1,d.length,sr);
  const r=c.createBuffer(1,d.length,sr);
  
  f.copyToChannel(d,0);
  
  const revData=new Float32Array(d.length);
  for(let i=0;i<d.length;i++){
    revData[i]=d[d.length-1-i];
  }
  r.copyToChannel(revData,0);
  
  return{f,r};
}

const rand=()=>KU[Math.floor(Math.random()*KU.length)];
const cur_=()=>S.players[S.turn];

function addPlayer(){
  const v=$("pn").value.trim();
  if(v&&S.players.length<30&&!S.players.includes(v))S.players.push(v);
  render();
  $("pn")&&$("pn").focus();
}
function rm(i){S.players.splice(i,1);render()}
function start(){S.scores={};S.players.forEach(p=>S.scores[p]=0);S.turn=0;S.screen="choose";S.msg="";render()}
function pick(m){S.showWord=false;S.mode=m;S.word=m==="preset"?rand():null;S.msg="";S.screen="input";render()}
function another(){S.word=rand();S.showWord=false;render()}

async function finish(buf,text){
  const p=processAudio(buf);
  S.fwd=p.f;
  S.rev=p.r;
  S.word=text;
  S.screen="listen";
  S.revealed=false;
  S.checked={};
  S.peek=false;
  S.tryRev=null;
  S.msg="";
  S.busy="";
  render();
  playBuffer(S.rev);
}

async function recordAction(){
  try{
    getCtx();
    if(!S.recObj){
      S.recObj=await startRecorder();
      S.busy="rec";
      render();
    }else{
      const rec=S.recObj;
      S.recObj=null;
      S.busy="ئامادەکردن...";
      render();
      const decodedBuf=await rec.stop();
      finish(decodedBuf,S.word);
    }
  }catch(err){
    S.busy="";
    S.recObj=null;
    S.msg="کێشەیەک لە تۆمارکردن هەیە. تکایە لە Safari ڕێگە بە مایکرۆفۆن بدە.";
    render();
  }
}

function tog(i,v){
  S.checked[i]=S.checked[i]===v?0:v;
  if(S.checked[i]>0&&window.confetti)confetti({particleCount:40,spread:60,origin:{y:0.8}});
  render();
}

let tryRecorder=null;
async function tryRecordAction(){
  try{
    getCtx();
    if(!tryRecorder){
      tryRecorder=await startRecorder();
      S.busy="tryRec";
      render();
    }else{
      const rec=tryRecorder;
      tryRecorder=null;
      S.busy="";
      const decodedBuf=await rec.stop();
      S.tryRev=processAudio(decodedBuf).r;
      render();
      playBuffer(S.tryRev);
    }
  }catch(err){
    tryRecorder=null;
    S.busy="";
    S.msg="مایک کار ناکات";
    render();
  }
}

function reveal(){S.revealed=true;render()}

function next(){
  const others=S.players.filter((_,i)=>i!==S.turn);
  if(S.players.length>1){
    let n=0;
    S.players.forEach((p,i)=>{if(S.checked[i]){S.scores[p]+=S.checked[i];n++}});
    if(S.mode!=="preset"&&others.length&&n===others.length)S.scores[cur_()]++;
    S.turn=(S.turn+1)%S.players.length;
  }
  S.screen="choose";
  render();
}

function end(){
  S.screen="final";
  if(window.confetti)confetti({particleCount:100,spread:70,origin:{y:0.6}});
  render();
}
function back(){S.screen="choose";S.recObj=null;S.busy="";render()}

function board(){
  return S.players.length>1?'<div class="card"><h3 style="margin:0 0 10px;font-size:16px;color:var(--gold)">🏆 خاڵەکان</h3>'+S.players.slice().sort((a,b)=>S.scores[b]-S.scores[a]).map(p=>`<div class="sc"><span>${e(p)}</span><b style="color:var(--ok)">${S.scores[p]} خاڵ</b></div>`).join("")+"</div>":"";
}

function render(){
  const A=$("app"),n=S.players.length;let h="";
  
  const header=`
    <div class="brand-header">
      <div class="brand-badge">
        <span class="dot"></span>
        <span><b>KAROSH</b> STUDIO</span>
      </div>
      <div class="hero-title">یاری ڕیڤێرس 🔁</div>
      <div class="hero-sub">دەنگت پێچەوانە بکەرەوە و تاقی بکەرەوە!</div>
    </div>`;

  if(S.screen==="setup"){
    h=`<div class="card">
      <h3 style="margin:0 0 10px">👥 ناوی یاریزانەکان</h3>
      <div class="row">
        <input id="pn" placeholder="ناوی یاریزان بنووسە..." onkeydown="if(event.key==='Enter')addPlayer()">
        <button class="s p" onclick="addPlayer()">+ زیادکردن</button>
      </div>
      <div class="chips">${S.players.map((p,i)=>`<span class="chip">${e(p)} <a onclick="rm(${i})">✕</a></span>`).join("")}</div>
      <p style="margin:10px 0 0;font-size:14px;color:var(--mu)">${n===0?"تکایە ناوی لانیکەم یەک کەس دابنێ":n===1?"یاری بە تەنیا":n+" یاریزان بەشدارن"}</p>
    </div>
    <button class="g" ${n?"":"disabled"} onclick="start()">🚀 دەستپێکردنی یاری</button>`;
  }else if(S.screen==="choose"){
    h=`<div class="card" style="text-align:center">
      <h2 style="margin:0 0 4px">${n>1?"نۆبەی: <span style='color:var(--gold)'>"+e(cur_())+"</span> 🎯":"🎤 خۆت یان وشەیەک؟"}</h2>
    </div>
    <button class="p" onclick="pick('speak')">🗣️ وشەیەک بە دەنگ دەڵێم</button>
    <button class="p" onclick="pick('preset')">🎲 وشەیەکم پێ بدە بۆ گوتن</button>
    ${board()}
    <button onclick="end()" style="color:#ef4444;border-color:rgba(239,68,68,0.3)">🛑 کۆتایی یاری</button>`;
  }else if(S.screen==="input"){
    const m=S.mode;
    h=`<div class="card">
      <h2 style="margin:0 0 8px">${m==="preset"?"🎲 ئەم وشەیە بە دەنگ بڵێ:":"🗣️ وشەکەت بە دەنگ بڵێ"}</h2>`+
      (m==="preset"?`<div class="big-box"><div class="big">${S.showWord?e(S.word):"• • •"}</div></div><button onclick="S.showWord=!S.showWord;render()">👁 ${S.showWord?"شاردنەوەی وشە":"پیشاندانی وشە"}</button><button onclick="another()" ${S.busy?"disabled":""}>🔄 وشەیەکی تر</button>`:"")+
      `<p style="color:var(--mu);font-size:14px">دوگمەی سوور دابگرە، وشەکە بڵێ و دووبارە دایبگرەوە بۆ وەستان.</p>
      <button id="bz" class="${S.busy==="rec"?"red":"p"}" onclick="recordAction()">
        ${S.busy==="rec"?'<span class="pulse">⏹ وەستان و پێچەوانەکردنەوە</span>':S.busy?e(S.busy):"⏺ دەستپێکردنی تۆمارکردن"}
      </button>
      ${S.msg?`<p style="color:#ef4444;font-size:14px;margin-top:6px">${e(S.msg)}</p>`:""}
    </div>
    <button onclick="back()">⬅️ گەڕانەوە</button>`;
  }else if(S.screen==="listen"){
    const others=S.players.map((p,i)=>[p,i]).filter(x=>S.mode==="preset"||x[1]!==S.turn);
    h=`<div class="card" style="text-align:center">
      <h2 style="margin:0 0 10px">گوێ بگرن و بیزانن! 👂</h2>
      <button class="p" onclick="playBuffer(S.rev)" style="font-size:18px;padding:18px">▶ گوێگرتن لە دەنگی ڕیڤێرس</button>
    </div>`;
    if(!S.revealed){
      h+=`<div class="card">`;
      if(S.word){h+=`<button onclick="S.peek=!S.peek;render()">🙈 قسەکەر: ${S.peek?"شاردنەوە":"بینینی وشە"}</button>`;if(S.peek)h+=`<div class="big-box"><div class="big">${e(S.word)}</div></div>`}
      h+=`<button class="g" onclick="reveal()">👁 پیشاندانی دەنگی ڕاستەقینە</button></div>`;
    }else{
      h+=`<div class="card">
        ${S.word?`<div class="big-box"><div class="big">${e(S.word)}</div></div>`:""}
        <button onclick="playBuffer(S.fwd)">▶ دەنگی ڕاستەقینەی وشەکە</button>
      </div>
      <div class="card">
        <h3 style="margin:0 0 6px">🎯 هەوڵی ڕیڤێرس</h3>
        <p style="color:var(--mu);font-size:13px;margin:0 0 10px">یاریزانێک وشە پێچەوانەکە دەڵێتەوە تا بزانرێت دەبێتەوە بە وشە ڕاستەکە:</p>
        <button class="${S.busy==="tryRec"?"red":"p"}" onclick="tryRecordAction()">${S.busy==="tryRec"?"⏹ وەستان":"⏺ تاقیکردنەوە"}</button>
        ${S.tryRev?'<button onclick="playBuffer(S.tryRev)">▶ ئەنجامی تاقیکردنەوە</button>':""}
      </div>`;
      if(n>1){
        h+=`<div class="card">
          <h3 style="margin:0 0 10px">کێ زانی؟</h3>
          ${others.map(([p,i])=>`<div style="margin-top:10px"><b>${e(p)}</b><div class="row" style="margin-top:6px"><button class="${S.checked[i]===1?"on":""}" onclick="tog(${i},1)">✅ زانی (١)</button><button class="${S.checked[i]===2?"on":""}" onclick="tog(${i},2)">🔥 ڕیڤێرس (٢)</button></div></div>`).join("")}
        </div>`;
      }
      h+=`<button class="g" onclick="next()">${n>1?"تۆمارکردن و یاریزانی داهاتوو ➡️":"خولی نوێ"}</button>`;
    }
  }else{
    h=`<div class="card" style="text-align:center">
      <div style="font-size:50px">🏆</div>
      <h1 style="margin:8px 0">ئەنجامی کۆتایی</h1>
      ${board()}
    </div>
    <button class="p" onclick="S.screen='setup';render()">🔄 دەستپێکردنەوەی یاری نوێ</button>`;
  }

  A.innerHTML = header + h + `
    <a class="foot" href="https://karoshgroup.com" target="_blank" rel="noopener">
      مافی چاپ و بڵاوکردنەوە پارێزراوە بۆ <b>Karosh Studio</b>
    </a>`;
}

render();
</script>
</body>
</html>

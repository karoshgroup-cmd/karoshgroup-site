<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karosh Group</title>
  <meta name="description" content="Choose your language | Karosh Group Photography" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .lang-landing{
      min-height:100vh;
      display:grid;place-items:center;
      padding:40px 16px;
      position:relative;
      background: radial-gradient(1200px 700px at 50% 0%, #14141c 0%, var(--bg) 55%);
    }
    .lang-card{
      width:min(520px, 100%);
      text-align:center;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:36px 28px;
      backdrop-filter:blur(16px);
      box-shadow:var(--shadow);
    }
    .lang-brand{
      display:flex;align-items:center;justify-content:center;gap:10px;
      margin-bottom:18px;
      letter-spacing:.12em;
      font-weight:800;font-size:14px;
    }
    .lang-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent-glow);}
    .lang-brand .muted{opacity:.6;font-weight:500}
    .lang-title{
      margin:0 0 12px;
      font-size:clamp(32px, 6vw, 48px);
      line-height:1.05;
      font-weight:300;
      letter-spacing:-.02em;
    }
    .lang-title strong{font-weight:800}
    .lang-sub{
      margin:0 0 24px;
      color:var(--muted);
      font-weight:500;
      line-height:1.8;
      font-size:15px;
    }
    .lang-buttons{
      display:flex;flex-direction:column;gap:12px;
    }
    .lang-btn-landing{
      display:flex;flex-direction:column;gap:4px;
      padding:18px 20px;
      border-radius:14px;
      background:var(--surface2);
      border:1px solid var(--line);
      transition:border-color .3s ease, background .3s ease, transform .3s ease;
      text-decoration:none;
      text-align:left;
    }
    .lang-btn-landing:hover{
      transform:translateY(-2px);
      border-color:rgba(201,168,76,.35);
      background:rgba(201,168,76,.06);
    }
    .lang-btn-landing .main{
      font-size:20px;font-weight:700;color:var(--text);
    }
    .lang-btn-landing .subline{
      font-size:13px;font-weight:500;color:var(--muted);
    }
    .lang-btn-landing.kurdish .subline{color:var(--accent);}
    .lang-note{
      margin-top:18px;
      font-size:12px;color:var(--muted);
    }
    .wa-float{position:fixed;bottom:24px;right:24px;z-index:200;width:56px;height:56px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.35);transition:transform .25s ease;cursor:pointer;border:none;}
    .wa-float:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(37,211,102,.5)}
    .wa-float svg{width:28px;height:28px;fill:#fff}
  </style>
</head>
<body style="background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;">

<main class="lang-landing">
  <div class="lang-card">
    <div class="lang-brand">
      <span class="lang-dot"></span>
      <span>KAROSH <span class="muted">GROUP</span></span>
    </div>
    <h1 class="lang-title">Choose Your <strong>Language</strong></h1>
    <p class="lang-sub">
      زمانەکەت هەلبژێرە<br>
      اختر لغتك المناسبة لك<br>
      Choose your language
    </p>
    <div class="lang-buttons">
      <a class="lang-btn-landing kurdish" href="/ku/">
        <span class="main">Kurdish (کوردی)</span>
        <span class="subline">🌟 سەڕۆکی هەڕبژاردن</span>
      </a>
      <a class="lang-btn-landing" href="/ar/">
        <span class="main">Arabic (العربية)</span>
        <span class="subline">اختر اللغة المناسبة لك</span>
      </a>
      <a class="lang-btn-landing" href="/en/">
        <span class="main">English</span>
        <span class="subline">Select your preferred language</span>
      </a>
    </div>
    <div class="lang-note">You can change language anytime from inside the site.</div>
  </div>
</main>

</html>
